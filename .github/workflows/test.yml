name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test with race detection
        run: go test -race -coverprofile coverage.out ./...

      - name: Enforce test coverage
        run: node scripts/check-coverage.mjs coverage.out

      - name: Vet
        run: go vet ./...

      - name: Check shell scripts
        shell: bash
        run: for script in scripts/*.sh; do bash -n "$script"; done

      - name: Test the npx launcher
        run: node scripts/test-npx-launcher.mjs
