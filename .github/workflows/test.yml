name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: go test ./...

      - name: Test the npx launcher
        run: node scripts/test-npx-launcher.mjs
