name: release

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify version metadata
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < internal/version/version.txt)"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "internal/version/version.txt must contain a v-prefixed semver: $version"
            exit 1
          fi
          if [[ "${version#v}" != "$package_version" ]]; then
            echo "version mismatch: $version vs package.json $package_version"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE:-}" == tag && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match repository version $version"
            exit 1
          fi

      - name: Test with race detection
        run: go test -race -coverprofile=coverage.out ./...

      - name: Enforce test coverage
        run: node scripts/check-coverage.mjs coverage.out

      - name: Vet
        run: go vet ./...

      - name: Check shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done

      - name: Test the npx launcher
        run: node scripts/test-npx-launcher.mjs

  snapshot:
    name: Validate GoReleaser snapshot
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: go.sum

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check -f .goreleaser

      - name: Build snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --skip=publish --clean -f .goreleaser

  publish:
    name: Publish release
    needs: test
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: go.sum

      - name: Publish release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean -f .goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
