  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="520" y="232" font-size="84" font-weight="700" letter-spacing="-1">annas-mcp</text>
    <text x="522" y="300" font-size="40" font-weight="500" fill="#f4d58d">Anna's Archive MCP server</text>
    <text x="522" y="368" font-size="30" fill="#d7e6dc">Search and download books and papers</text>
