    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14532d"/>
      <stop offset="1" stop-color="#0b3b2e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- The icon's shelf and download badge, without its tile -->
  <g transform="translate(64 120) scale(0.78)">
    <rect x="96" y="120" width="64" height="260" rx="10" fill="#f4d58d"/>
    <rect x="96" y="160" width="64" height="14" fill="#d9b25f"/>
    <rect x="96" y="326" width="64" height="14" fill="#d9b25f"/>
    <rect x="172" y="150" width="56" height="230" rx="10" fill="#f28f6b"/>
    <rect x="172" y="186" width="56" height="12" fill="#cf6b48"/>
    <rect x="172" y="330" width="56" height="12" fill="#cf6b48"/>
    <rect x="240" y="104" width="60" height="276" rx="10" fill="#9cc9f0"/>
    <rect x="240" y="146" width="60" height="14" fill="#6fa3d1"/>
    <rect x="240" y="330" width="60" height="14" fill="#6fa3d1"/>
    <rect x="80" y="380" width="252" height="18" rx="9" fill="#e7efe9"/>
